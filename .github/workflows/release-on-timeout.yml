name: Release on timeout

# Stage 2 of 3. Hourly sweep. Any review pull request older than the hold window
# is stamped as UNREVIEWED and merged, which publishes it.
#
# The stamp is written to the branch BEFORE the merge, so the edition arrives on
# main already marked "auto" and the publish workflow will not upgrade it to
# "approved". That ordering is what stops the site claiming a review that did not
# happen — do not reorder these steps.
#
# To turn this off and require approval for every edition:
#   1. comment out the `schedule:` block below
#   2. set editorial.review_mode to "hold_until_approved" in site.json
# Editions will then wait indefinitely, and the site's wording changes to match.

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-on-timeout
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the hold window
        id: cfg
        run: |
          HOURS=$(python3 -c "import json; c = json.load(open('site.json'))['editorial']; print(0 if c.get('review_mode') != 'hold_then_publish' else c.get('hold_hours', 12))")
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "Hold window: $HOURS hour(s) (0 = timeout release disabled)"

      - name: Release expired editions
        if: steps.cfg.outputs.hours != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          HOURS=${{ steps.cfg.outputs.hours }}
          CUTOFF=$(date -u -d "-$HOURS hours" +%s)

          gh pr list --state open --limit 50 \
            --json number,headRefName,createdAt,title \
            --jq '.[] | select(.headRefName | startswith("edition/")) |
                  [.number, .headRefName, .createdAt] | @tsv' > /tmp/prs.tsv || true

          if [ ! -s /tmp/prs.tsv ]; then
            echo "No open edition pull requests."
            exit 0
          fi

          while IFS=$'\t' read -r NUM BRANCH CREATED; do
            [ -n "$NUM" ] || continue
            AGE=$(date -u -d "$CREATED" +%s)
            if [ "$AGE" -gt "$CUTOFF" ]; then
              REMAIN=$(( (AGE - CUTOFF) / 3600 ))
              echo "PR #$NUM ($BRANCH) still within the window — about ${REMAIN}h left."
              continue
            fi

            DATE="${BRANCH#edition/}"
            echo "PR #$NUM ($BRANCH) expired. Releasing it as UNREVIEWED."

            git config user.name  "newswire-bot"
            git config user.email "actions@users.noreply.github.com"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            # Stamp BEFORE merging. This is what makes the site tell the truth.
            python3 scripts/stamp_review.py "content/$DATE" --status auto
            git add "content/$DATE/edition.json"
            git commit -m "Edition of $DATE published without editorial review"
            git push origin "$BRANCH"

            gh pr comment "$NUM" --body \
              "Review window of ${HOURS}h expired. Publishing automatically, labelled on the site as **not reviewed by an editor**."
            gh pr merge "$NUM" --merge --delete-branch
            git checkout main
          done < /tmp/prs.tsv
