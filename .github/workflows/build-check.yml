name: Build check

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all editions
        run: |
          fail=0
          for d in content/*/; do
            [ -d "$d" ] || continue
            echo "── $d"
            python3 pipeline/validate.py "$d" || fail=1
          done
          exit $fail
      - name: Check the archive for duplicates
        run: |
          # --dry-run: report only. A hand-edited follow-up should not be deleted
          # by CI; this surfaces the problem for a person to judge.
          for d in content/*/; do
            [ -d "$d" ] || continue
            python3 pipeline/dedupe.py "$d" --dry-run
          done

      - name: Build
        run: python3 build.py
      - name: Check internal links resolve
        run: python3 scripts/check_links.py
